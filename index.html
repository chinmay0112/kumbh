<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll film</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"
    ></script>
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>

    <script defer src="script.js"></script>
  </head>
  <body>
    <main>
      <section class="story" aria-label="Scroll film">
        <div class="story-stage">
          <video
            id="scrollVideo"
            muted
            playsinline
            preload="auto"
            aria-label="Scroll-controlled video"
          >
            <!-- Previous video: video1.mp4 (retained for restoring later). -->
            <source src="assets/hero-video-1.mp4" type="video/mp4" />
          </video>
          <div class="end-logo" aria-hidden="true">
            <img src="logo.png" alt="Kumbh logo" />
          </div>
          <div class="next-page-preview" aria-hidden="true" inert>
            <iframe
              src="new-page.html"
              title="Preview of the next page"
              tabindex="-1"
            ></iframe>
          </div>
          <div class="next-page-preview" aria-hidden="true" inert>
            <iframe
              src="new-page.html"
              title="Preview of the next page"
              tabindex="-1"
            ></iframe>
          </div>
          <div class="entry-caption">
            <h1>Step into the Kumbh</h1>
            <p>Scroll to enter</p>
          </div>
          <button class="sound-toggle" type="button" aria-pressed="false">
            Enable sound
          </button>
          <p class="video-status" role="status"></p>
        </div>
      </section>
    </main>
  </body>
</html>
